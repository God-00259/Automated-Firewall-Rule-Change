{% extends "base.html" %}

{% block title %}Login - Firewall Workflow{% endblock %}

{% block content %}
<div class="login-box card">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">🔐 Secure Login</h2>
    <form method="POST" action="{{ url_for('login') }}">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" required placeholder="Enter password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    
    <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e9ecef;">
        <p style="font-size: 0.9rem; color: #666; margin-bottom: 0.5rem;"><strong>Demo Accounts:</strong></p>
        <table style="font-size: 0.85rem;">
            <tr><td><code>john_doe</code></td><td>password123</td><td>Requester</td></tr>
            <tr><td><code>security_sarah</code></td><td>password123</td><td>Security Officer</td></tr>
            <tr><td><code>admin_mike</code></td><td>password123</td><td>Admin</td></tr>
        </table>
    </div>
</div>
{% endblock %}
